{% extends "base.html" %}

{% block title %}Email Provider Settings{% endblock %}

{% block extra_css %}
.card { background-color: #ffffff; }
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">

    <!-- Notification message -->
    {% if message %}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <form id="settingsForm" method="POST" action="/save_settings">
      <div class="card shadow-lg rounded-4 border-0">
        <div class="card-body p-4">
          <h4 class="card-title mb-3 text-center">Email Configuration</h4>

          <!-- Email Provider Selection -->
          <div class="mb-3">
            <label class="form-label d-block fw-semibold">Choose Email Provider</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="email_provider" value="gmail" id="gmailOption"
                {{ 'checked' if config.get('email_provider')=='gmail' or not config.get('email_provider') else '' }} />
              <label class="form-check-label" for="gmailOption">Gmail</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="email_provider" value="custom" id="customOption"
                {{ 'checked' if config.get('email_provider')=='custom' else '' }} />
              <label class="form-check-label" for="customOption">Custom SMTP</label>
            </div>
          </div>

          <!-- Gmail Settings -->
          <div id="gmail_settings" class="mb-3"
            style="display: {{ 'block' if config.get('email_provider') == 'gmail' or not config.get('email_provider') else 'none' }};">
            <div class="mb-3">
              <label for="gmailEmail" class="form-label">Gmail Address</label>
              <input type="email" class="form-control" id="gmailEmail" name="gmail_sender_email"
                placeholder="example@gmail.com" value="{{ config.get('gmail_sender_email', '') }}" />
            </div>
            <div class="mb-3">
              <label for="gmailPassword" class="form-label">App Password</label>
              <input type="password" class="form-control" id="gmailPassword" name="gmail_app_password"
                placeholder="App Password" value="{{ config.get('gmail_app_password', '') }}" />
            </div>
          </div>

          <!-- Custom SMTP Settings -->
          <div id="custom_settings" class="mb-3"
            style="display: {{ 'block' if config.get('email_provider') == 'custom' else 'none' }};">
            <div class="mb-3">
              <label for="customEmail" class="form-label">Sender Email</label>
              <input type="email" class="form-control" id="customEmail" name="custom_sender_email"
                placeholder="your@email.com" value="{{ config.get('custom_sender_email', '') }}" />
            </div>
            <div class="mb-3">
              <label for="customPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="customPassword" name="custom_password"
                placeholder="Password" value="{{ config.get('custom_password', '') }}" />
            </div>
            <div class="mb-3">
              <label for="smtpHost" class="form-label">SMTP Host</label>
              <input type="text" class="form-control" id="smtpHost" name="custom_smtp_host"
                placeholder="smtp.yourhost.com" value="{{ config.get('custom_smtp_host', '') }}" />
            </div>
            <div class="mb-3">
              <label for="smtpPort" class="form-label">SMTP Port</label>
              <input type="number" class="form-control" id="smtpPort" name="custom_smtp_port" placeholder="465"
                value="{{ config.get('custom_smtp_port', '') }}" />
            </div>
          </div>

          <!-- Save Button -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary rounded-pill fw-semibold">Save Settings</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.querySelectorAll('input[name="email_provider"]').forEach((elem) => {
    elem.addEventListener('change', function () {
      document.getElementById('gmail_settings').style.display = this.value === 'gmail' ? 'block' : 'none';
      document.getElementById('custom_settings').style.display = this.value === 'custom' ? 'block' : 'none';
    });
  });
</script>
{% endblock %}
