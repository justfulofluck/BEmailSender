<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Provider Settings</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>

    body {
      background-color: #05429deb !important;
    }
    .card {
      background-color: #ffffff; 
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">📧 Bulk Email Sender</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="/settings">Settings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/help">Help</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <!-- Notification message -->
        {% if message %}
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endif %}

        <form id="settingsForm" method="POST" action="/save_settings">
          <div class="card shadow-lg rounded-4 border-0">
            <div class="card-body p-4">
              <h4 class="card-title mb-3 text-center">Email Configuration</h4>

              <!-- Email Provider Selection -->
              <div class="mb-3">
                <label class="form-label d-block fw-semibold">Choose Email Provider</label>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="email_provider"
                    value="gmail"
                    id="gmailOption"
                    checked
                  />
                  <label class="form-check-label" for="gmailOption">Gmail</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="email_provider"
                    value="custom"
                    id="customOption"
                  />
                  <label class="form-check-label" for="customOption">Custom SMTP</label>
                </div>
              </div>

              <!-- Gmail Settings -->
              <div id="gmail_settings" class="mb-3">
                <div class="mb-3">
                  <label for="gmailEmail" class="form-label">Gmail Address</label>
                  <input
                    type="email"
                    class="form-control"
                    id="gmailEmail"
                    name="gmail_sender_email"
                    placeholder="example@gmail.com"
                  />
                </div>
                <div class="mb-3">
                  <label for="gmailPassword" class="form-label">App Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="gmailPassword"
                    name="gmail_app_password"
                    placeholder="App Password"
                  />
                </div>
              </div>

              <!-- Custom SMTP Settings -->
              <div id="custom_settings" class="mb-3" style="display:none;">
                <div class="mb-3">
                  <label for="customEmail" class="form-label">Sender Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="customEmail"
                    name="custom_sender_email"
                    placeholder="your@email.com"
                  />
                </div>
                <div class="mb-3">
                  <label for="customPassword" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="customPassword"
                    name="custom_password"
                    placeholder="Password"
                  />
                </div>
                <div class="mb-3">
                  <label for="smtpHost" class="form-label">SMTP Host</label>
                  <input
                    type="text"
                    class="form-control"
                    id="smtpHost"
                    name="custom_smtp_host"
                    placeholder="smtp.yourhost.com"
                  />
                </div>
                <div class="mb-3">
                  <label for="smtpPort" class="form-label">SMTP Port</label>
                  <input
                    type="number"
                    class="form-control"
                    id="smtpPort"
                    name="custom_smtp_port"
                    placeholder="465"
                  />
                </div>
              </div>

              <!-- Save Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary rounded-pill fw-semibold">Save Settings</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('input[name="email_provider"]').forEach((elem) => {
      elem.addEventListener('change', function () {
        document.getElementById('gmail_settings').style.display = this.value === 'gmail' ? 'block' : 'none';
        document.getElementById('custom_settings').style.display = this.value === 'custom' ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
